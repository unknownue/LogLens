[package]
name = "loglens"
version = "0.1.0"
description = "LogLens — 大日志实时查看器（tail-follow + 过滤 + 稀疏虚拟滚动）"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "loglens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 可执行文件显示名改为 LogLens（Windows 资源管理器显示 LogLens.exe）。
# Cargo package name 不允许大写，故用 [[bin]] 显式指定二进制名。
[[bin]]
name = "LogLens"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
regex = "1"
aho-corasick = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-tracy = { version = "0.11", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[features]
# 性能分析：接入 Tracy 采样器（https://github.com/wolfpld/tracy）。
# 构建：cargo build --features tracy（或 pnpm tauri build --no-bundle -- --features tracy）
# 运行：先启动 Tracy GUI capture server，再设环境变量 TRACY=1 启动应用。
# 默认关闭：无 tracy 客户端时不会尝试连接，零运行时开销（span 为空操作）。
tracy = ["dep:tracing-tracy", "dep:tracing-subscriber"]

[dev-dependencies]
tempfile = "3"

# release 编译优化（发布版）：以一次性更长的构建时间为代价，换取运行时性能
# 与二进制体积的最佳状态。
[profile.release]
opt-level = 3          # 最高优化等级：日志增量读取/过滤/序列化是 CPU 热点
lto = true             # fat LTO，跨 crate 内联
codegen-units = 1      # 单 codegen 单元，内联与去重最充分
strip = true           # 剥离符号 + 调试信息，显著减小 exe
panic = "abort"        # panic 直接终止：去掉 unwind 落地垫，体积更小、指令更紧凑
                       #（tauri 命令不 catch_unwind，unwind 也无收益）
incremental = false    # 关闭增量缓存，保证干净的全量优化

